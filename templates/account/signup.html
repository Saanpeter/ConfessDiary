{% extends "base.html" %}
{% load socialaccount %}

{% block title %}Sign In - Whisperbook{% endblock %}

{% block content %}

<div class="auth-card">

    <h2 class="page-title">Welcome to Whisperbook</h2>

    <p class="auth-text">
        Sign in with your Google account to continue.
    </p>

    <a href="{% provider_login_url 'google' %}" class="google-btn">
        Continue with Google
    </a>

    <p>
        Already signed in?
        <a href="{% url 'account_login' %}">
            Go to Login
        </a>
    </p>

</div>

{% endblock %}
