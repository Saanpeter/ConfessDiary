{% extends "base.html" %}
{% load allauth %}

{% block title %}Sign Up — Whisperbook{% endblock %}

{% block content %}
<div class="auth-card">
    <h2 class="page-title">Join Whisperbook</h2>
    <p class="auth-subtext">
        Already have an account? <a href="{% url 'account_login' %}">Sign in</a>
    </p>

    {% if form.non_field_errors %}
        <div class="auth-error">{{ form.non_field_errors }}</div>
    {% endif %}

    <form method="post" action="{% url 'account_signup' %}" class="auth-form">
        {% csrf_token %}

        <label for="id_email">Email</label>
        <input type="email" name="email" id="id_email" placeholder="Email address" autofocus>

        <label for="id_password1">Password</label>
        <input type="password" name="password1" id="id_password1" placeholder="Password">

        <label for="id_password2">Confirm password</label>
        <input type="password" name="password2" id="id_password2" placeholder="Confirm password">

        <button type="submit" class="post-btn auth-submit">Create Account</button>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <a href="{% provider_login_url 'google' %}" class="google-btn">
        Continue with Google
    </a>
</div>
{% endblock %}
