{% extends "base.html" %}

{% block page_title %}Report a Problem{% endblock %}
{% block page_subtitle %}Settings{% endblock %}

{% block content %}
<div class="placeholder-card" style="text-align:left;">
    <p style="color:var(--ink-soft);">Tell us what's wrong — bug, abuse, or anything else.</p>
    <form method="post">
        {% csrf_token %}
        <textarea name="message" placeholder="Describe the problem..." required
                  style="width:100%;min-height:120px;font-family:'Kalam',cursive;padding:10px;border-radius:6px;border:1px solid #ddd;"></textarea>
        <br><br>
        <button type="submit" class="post-btn">Submit Report</button>
    </form>
    <p style="margin-top:20px;"><a href="{% url 'settings_page' %}" class="nav-link">← Back to Settings</a></p>
</div>
{% endblock %}
